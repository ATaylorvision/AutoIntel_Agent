<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <linearGradient id="logoSwoosh" x1="60" y1="320" x2="380" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8B5CF6"/>
      <stop offset="60%" stopColor="#A855F7"/>
      <stop offset="100%" stopColor="#C084FC"/>
    </linearGradient>
    <linearGradient id="logoIPillar" x1="315" y1="110" x2="355" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#A855F7"/>
      <stop offset="100%" stopColor="#7E22CE"/>
    </linearGradient>
  </defs>

  <!-- Monogram Mark Group -->
  <g transform="translate(250, 200) scale(1.8) translate(-80, -80)">
    <!-- Geometric 'A' apex background framework -->
    <path
      d="M62 38L32 122H50L58 100H88L94 116H100"
      stroke="#CBD5E1"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M62 38L88 100"
      stroke="#CBD5E1"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Secondary aerodynamic airflow contours -->
    <path
      d="M48 94C60 84 84 80 110 88"
      stroke="#D8B4FE"
      stroke-width="3"
      stroke-linecap="round"
    />
    <path
      d="M56 102C68 94 92 90 120 100"
      stroke="#D8B4FE"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Primary Aerodynamic Speed Swoosh / Fender curve wrapping across -->
    <path
      d="M24 82C22 70 36 60 56 54C78 48 102 50 116 68C124 78 126 94 108 98C82 104 46 108 32 94C26 88 24 84 24 82Z"
      fill="url(#logoSwoosh)"
      fill-opacity="0.15"
    />
    <path
      d="M24 82C30 56 65 50 96 60C118 68 132 86 112 96C88 108 42 108 26 86"
      stroke="url(#logoSwoosh)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- The 'I' Pillar -->
    <rect
      x="104"
      y="38"
      width="16"
      height="84"
      rx="3"
      fill="url(#logoIPillar)"
    />

    <!-- Antenna / Spark Sensor accent projecting from top right of the 'I' -->
    <path
      d="M120 48H138"
      stroke="#A855F7"
      stroke-width="4"
      stroke-linecap="round"
    />
    <circle
      cx="142"
      cy="48"
      r="4.5"
      fill="#A855F7"
    />
    <circle
      cx="142"
      cy="48"
      r="2"
      fill="#FFFFFF"
    />
  </g>

  <!-- Typography matching exact uploaded artwork -->
  <text x="250" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" letter-spacing="6" fill="#0F172A">AUTO <tspan fill="#9333EA">INTEL</tspan></text>
  <g transform="translate(250, 452)">
    <line x1="-120" y1="0" x2="-60" y2="0" stroke="#94A3B8" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="10" fill="#64748B">AGENT</text>
    <line x1="60" y1="0" x2="120" y2="0" stroke="#94A3B8" stroke-width="2"/>
  </g>
</svg>
